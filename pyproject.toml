[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dac-coverage-representation"
version = "1.0.0"
description = "Reproduction code for measured-domain coverage and equilibrium representation in weather-resolved DAC analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scipy>=1.11,<2",
  "matplotlib>=3.8,<4",
  "pillow>=10,<13",
  "openpyxl>=3.1,<4",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "jupyterlab>=4,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

